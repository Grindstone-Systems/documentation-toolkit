access:
  edition: Hosted web app
  cost: free
  notes: Experimental, in its testing phase. The app is a static site that runs entirely in your browser, with no
    account, server, upload or time limit. Documents you export are yours. The
    source is Apache-2.0 and can be self-hosted. The optional local extension
    (CLI and MCP server) runs on your own machine and uses your own AI
    assistant, if you choose to use one.
  account_required: false
requirements:
  - name: Modern web browser
    kind: software
    cost: free
    notes: Current Chrome, Edge, Firefox or Safari. Processing and export work
      offline once the app has loaded.
  - name: Ignition exports
    kind: software
    cost: optional-paid
    notes: A project export (8.x), a tag export (JSON) or a gateway backup.
      8.1 and 8.3 backups include gateway configuration (tags, UDTs, alarms,
      connections and devices). A sample project is built in.
  - name: Node.js 22
    kind: software
    cost: free
    notes: Only for the optional local extension (oic-docs CLI and MCP server),
      built from source until it is published.
    applies_to:
      - agents
  - name: AI assistant
    kind: service
    cost: optional-paid
    notes: Optional. Claude Code, Codex or another MCP client, on your own
      subscription. The basic pack needs no AI.
    applies_to:
      - agents
