faq:
  - question: What does Experimental mean here?
    answer: The toolkit is in its testing phase. It is tested on a synthetic
      sample and a small number of real Ignition 8.1 and 8.3 backups, formats
      and outputs may still change, and generated documents should be checked
      against the source before anyone relies on them. Reports of what it gets
      wrong are welcome in the issue tracker.
  - question: Is my backup uploaded anywhere?
    answer: No. Files are read in your browser and never leave your device. The
      app makes no requests beyond its own files, and a CI check fails the build
      if that changes. Credentials in the backup are never read.
  - question: Does it need AI?
    answer: No. The reference, frameworks and every export are generated
      deterministically. AI is optional, through your own assistant and the
      local extension, and anything it writes is marked AI draft.
  - question: Will it write our operating procedures?
    answer: No. Operating steps, alarm responses and safety information can't
      be established from configuration. Those sections stay Unresolved until
      the site supplies approved text.
  - question: Which Ignition versions are supported?
    answer: Project exports from 8.x, tag exports (JSON), and 8.1 and 8.3
      gateway backups including their tags, UDTs, alarms, connections and
      devices. An 8.1 backup keeps that configuration in an internal database,
      which the toolkit reads without running it; that reader has been tested
      on one real 8.1 backup so far. Vision windows and reports are listed by
      name. Tested on a synthetic sample and a small number of real 8.1 and 8.3
      backups.
  - question: Is this an Inductive Automation product?
    answer: No. It's an independent open-source utility that reads exported
      files. It doesn't replace the Designer or imply endorsement.
